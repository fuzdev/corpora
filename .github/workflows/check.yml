# One job on every push to main and every PR: the repo's own TypeScript passes `gro check`
# (typecheck, unit tests, gen, format), then the snapshot must reproduce from the manifest.
# `npm run materialize:check` re-materializes every collection at its pinned commit —
# fetched shallowly from each upstream, since this runner has no sibling checkouts —
# and compares the result byte for byte with the committed `collections/`, plus the
# recomputed lock entries with `lock.json`. That check is also the license gate: a
# collection whose license file or declaration does not read as its manifest SPDX id
# fails inside it.
#
# No scheduled run: a refresh re-pins every consumer's counts, so it is always a
# deliberate PR, never a cron.

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config, so a
      # compromised build dependency can't read it; no step here pushes via git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.14
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14'
          cache: npm

      - run: npm ci
      - run: npx @fuzdev/gro check --workspace

      # the materializer's own step, byte for byte, apart from the code gate above
      - run: npm run materialize:check
